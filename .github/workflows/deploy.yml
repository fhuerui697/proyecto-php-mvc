name: Desplegar en Alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Instalar sshpass
        run: sudo apt-get install -y sshpass

      - name: Desplegar
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}

        run: |
          servidor="$SSH_USER@$SSH_HOST"
          ruta="/home/$SSH_USER/www/proyecto"

          sshpass -e ssh -o StrictHostKeyChecking=accept-new "$servidor" "mkdir -p '$ruta'"

          sshpass -e rsync -az --exclude='config.php' src/ "$servidor:$ruta/"

          sshpass -e ssh "$servidor" "cd '$ruta' && php init.php"